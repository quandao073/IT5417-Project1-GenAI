[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cxr-search"
version = "0.1.0"
description = "Semantic retrieval for chest X-rays using image embeddings, structured CheXpert labels and report full-text search"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }

# Only what both the API and the worker need.
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "structlog>=24.1",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "qdrant-client>=1.9",
  "polars>=1.0",
  "pyarrow>=16.0",
]
worker = [
  "polars>=1.0",
  "pyarrow>=16.0",
  "pillow>=10.3",
  "numpy>=1.26",
  "tqdm>=4.66",
  "qdrant-client>=1.9",
  # torch/open_clip are installed separately in docker/worker.Dockerfile so the
  # CUDA build can be pinned per machine.
]
# The Phase 2 spike and the embedding run. Pins must match docker/worker.Dockerfile;
# tests/unit/test_embed_deps.py enforces that. PyPI's Windows torch wheel is the
# CPU build, which is what the model gate requires. On Linux, `uv sync --all-extras`
# pulls the CUDA torch build (several GB of nvidia packages); the Docker worker
# installs CPU torch separately.
embed = [
  "torch==2.4.1",
  "torchvision==0.19.1",
  "open_clip_torch==2.24.0",
  "transformers==4.44.2",
  "huggingface_hub",
  "gdown>=5.1",
  "psutil>=5.9",
]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "mypy>=1.10",
]

[project.scripts]
cxr = "src.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Model tests load real weights (seconds each, hundreds of MB). Run them with
# `uv run pytest -m model`; a later -m overrides this one.
addopts = '-m "not model"'
markers = [
  "integration: needs an external service (qdrant) running",
  "e2e: runs against the whole stack once it is up",
  "model: loads real VLM weights; skipped unless already downloaded",
]

[tool.mypy]
python_version = "3.11"
packages = ["src"]
ignore_missing_imports = true
