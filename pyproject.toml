[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cxr-retrieval"
version = "0.1.0"
description = "Semantic retrieval for chest X-rays using image embeddings, report FTS and a RadGraph-derived knowledge graph"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }

# Chỉ những gì cả API lẫn worker đều cần.
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "structlog>=24.1",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "qdrant-client>=1.9",
  "neo4j>=5.20",
  "pyarrow>=16.0",
  "pandas>=2.2",
]
worker = [
  "pandas>=2.2",
  "pyarrow>=16.0",
  "pillow>=10.3",
  "tqdm>=4.66",
  "qdrant-client>=1.9",
  "neo4j>=5.20",
  # torch/open_clip cài riêng trong docker/worker.Dockerfile theo đúng CUDA build
]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "mypy>=1.10",
  "pandera>=0.19",
]

[project.scripts]
cxr = "cxr_retrieval.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/cxr_retrieval"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: cần service ngoài (qdrant/neo4j) đang chạy",
  "e2e: chạy qua toàn bộ stack đã up",
]

[tool.mypy]
python_version = "3.11"
packages = ["cxr_retrieval"]
ignore_missing_imports = true
