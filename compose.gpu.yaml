# Override for the worker profile only. Use together with compose.yaml:
#   docker compose -f compose.yaml -f compose.gpu.yaml --profile worker run --rm worker embed
#
# Requires WSL2 + NVIDIA Container Toolkit. Check first with:
#   docker run --rm --gpus all nvidia/cuda:12.4.1-base-ubuntu22.04 nvidia-smi

services:
  worker:
    build:
      args:
        TORCH_INDEX: https://download.pytorch.org/whl/cu124
    environment:
      EMBEDDING_DEVICE: cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
