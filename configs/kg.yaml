# Knowledge graph build (docs/v2-kg-design.md; WORKLOG D48-D50).
#
# UMLS data never enters git or a Docker image (D49): the NLM release stays in data/umls/raw/,
# the filtered Parquet in data/umls/<version>/. The input paths come from .env (UMLS_ZIP,
# UMLS_META_DIR), not from this file.

umls:
  version: 2026AA
  max_srl: 0                       # MRCONSO source restriction level kept (Level 0 Subset)
  include_snomed: false            # true only after MLDS registration and the Full Subset (D48)
  rel_sabs: [MSH, NCI, FMA, HPO]   # MRREL sources kept

# Pool vocabulary probe, TIP V2-2 (WORKLOG D52). Modifiers of an Observation drop all four groups; modifiers of an
# Anatomy drop only `laterality` (position words there are left to the MRCONSO check).
vocab:
  coverage_levels: [0.80, 0.90, 0.95, 0.99]
  gate: {kind: Observation, coverage: 0.90, max_strings: 500}
  drop_modifiers:
    severity: [trace, tiny, minimal, minor, slight, slightly, subtle, small, mild, mildly, moderate, moderately,
               large, severe, severely, marked, markedly, extensive, massive, significant]
    temporal: [stable, unchanged, new, increased, increasing, decreased, decreasing, improved, improving, worsened,
               worsening, resolved, resolving, persistent, persistently]
    position: [basilar, bibasilar, basal, bibasal, upper, lower, middle, mid, apical, lateral, medial]
    laterality: [left, right, bilateral, bilaterally, unilateral]

# Vocabulary strings -> CUIs, TIP V2-3 (WORKLOG D56). Hand decisions (string -> CUI or skip) live in
# configs/kg/linker_overrides.yaml.
linker:
  scope: 0.95            # head of each kind's D52 vocabulary that is linked
  review_full: 0.80      # every string of this head is reviewed by hand
  review_partial: 0.90   # up to here, only strings that are not `exact`, or `exact` with several CUIs
  labels:                # semantic types per KG label (docs/v2-kg-design.md, label table)
    Disease: [T047, T191]
    Finding: [T033, T046, T184, T190, T037]
    Device: [T074]
    Anatomy: [T023, T024, T029, T030]
  kinds: {Observation: [Finding, Disease, Device], Anatomy: [Anatomy]}
  normal: [clear, normal, unremarkable, normal limits, within normal limits, normal limit]
  descriptive: [low, enlarged, prominence, prominent, marking, blunting, elevation, tortuous, thickening]
  # Anatomy adjective -> noun, matched like a string. Only unambiguous pairs; the others go to SapBERT and review.
  adjectives:
    pleural: pleura
    pulmonary: lung
    osseous: bone
    bony: bone
    mediastinal: mediastinum
    cardiac: heart
    aortic: aorta
    tracheal: trachea
    thoracic: thorax
    spinal: spine
    vertebral: vertebra
    clavicular: clavicle
    humeral: humerus
    scapular: scapula
    sternal: sternum
    gastric: stomach
    esophageal: esophagus
    abdominal: abdomen
    diaphragmatic: diaphragm
    pericardial: pericardium
    hilar: hilum
    axillary: axilla
    venous: vein
    arterial: artery
    bronchial: bronchus
    jugular: jugular vein
    basilar: lung base
    bibasilar: lung base
    basal: lung base
    bibasal: lung base
    apical: lung apex
    biapical: lung apex
  laterality: [left, right, bilateral]   # a CUI named with one of these moves to its unlateralised parent
  pairs: {coverage: 0.90, max_pairs: 10} # located_at pairs tried per Observation string
  # Candidate filter for exact, SapBERT and pair links (D56, option C; notes/v2-link-roots.md). A CUI of the
  # label table stays unless every name comes from code_sabs, or it lies below a negative root of its kind and
  # below none of the positive ones. "Below": FMA parts and isa (relas) and every source's CHD rows (T39).
  domain:
    code_sabs: [LNC, HL7V2.5, HL7V3.0, HCPCS, CVX, CDCREC, SOP, MTHCMSFRF,  # code systems
                VANDF, SPN, MTHSPL, RXNORM, ATC, MED-RT,                    # product and drug lists
                ICD9CM, MTHICD9, ICPC, CCS, CCSR_ICD10CM, CCSR_ICD10PCS]     # statistical classifications
    relas: [regional_part_of, constitutional_part_of, isa]
    anatomy:
      positive: [C0817096, C0027530, C1140618, C0000726]   # thorax, neck, upper limb, abdomen
      negative: [C0018670, C0023216, C0559769, C0030797]   # head, lower limb, pelvis (FMA; MSH and NCI)
    observation:
      positive: [C0035242, C0035204, C4018871,   # respiratory: MSH, NCI, HPO
                 C0007222, C0243050,             # cardiovascular: MSH and NCI, HPO
                 C0039978, C4021797,             # thoracic: MSH, HPO
                 C0016658, C0037933, C4021789,   # bone fracture, spinal diseases, vertebral column (HPO)
                 C0027651]                       # neoplasm
      negative: [C0015397, C0038368, C0027765,   # eye, stomatognathic, nervous system diseases
                 C0037274, C0032962,             # skin diseases, pregnancy complications
                 C1720887, C1720894,             # female, male urogenital diseases
                 C0004936, C0013447,             # mental disorders, ear diseases
                 C0455788]                       # oral cavity finding
  sapbert:
    model_id: cambridgeltl/SapBERT-from-PubMedBERT-fulltext
    revision: 090663c3ae57bf35ffe4d0d468a2a88d03051a4d
    license: apache-2.0
    max_length: 25
    batch_size: 256
  # Selection step (D56): SapBERT only gathers candidates, the top_k dictionary names of the kind's domain with
  # cosine >= floor (proposed 2026-11-01), merged with the exact CUIs; two LLMs choose among them.
  candidates: {top_k: 10, floor: 0.5}
  llm:
    prompt_file: prompts/kg_link_select_v1.txt   # relative to configs/; sha256 in the manifest (D20)
    workers: 8
    # Two Anthropic models run independently (no OpenAI credit, 2026-11-01). Same family: weaker independence
    # than two providers (D56). No refusal fallback: a refusal is `none`, reason "refused".
    models:
      opus: {model: claude-opus-5-5, effort: medium, max_tokens: 8000, timeout_seconds: 120}
      sonnet: {model: claude-sonnet-5-5, effort: medium, max_tokens: 8000, timeout_seconds: 120}
  # Silver-standard judge of the gate sample: Anthropic's most capable model, its own prompt; behind --judge.
  judge:
    prompt_file: prompts/kg_link_judge_v1.txt
    workers: 4
    model: {model: claude-fable-5-1, effort: high, max_tokens: 16000, timeout_seconds: 300}
  flags:
    thin_sources: [CHV, MTH]
    off_domain_words: [tooth, teeth, dental, knee, hip, foot, brain, cerebral, eye, ocular, retina, breast, uterus,
                       uterine, ovary, ovarian, prostate, testis]
  # A phrase of label X matches X's CUI, its children or a CUI below them; for device_label, any device of the domain.
  chexpert_phrases: {repo: stanfordmlgroup/chexpert-labeler, commit: 44ddeb363149aa657296237f18b5472a73c1756f,
                     license: MIT, device_label: "PRJ:support_devices"}
  gate: {precision: 0.85, coverage_by_mentions: 0.90, sample: 200, seed: 20260101}

# Knowledge graph tables, TIP V2-4 (WORKLOG D57, D58). Growth stays inside linker.domain (option C).
graph:
  anatomy_depth: 3        # FMA parts and isa, each way
  finding_down: 2         # IS_A steps down from a core finding or disease
  finding_up: 6           # IS_A steps up, stopping at stop_up
  stop_up: [C0035242, C0035204, C4018871, C0007222, C0243050, C0039978, C4021797, C0016658, C0037933, C4021789,
            C0027651,       # the positive roots of the domain
            C0012634, C0243095, C0037088, C3540840, C2825141, C1704258, C0027653]  # disease, finding, sign or
                            # symptom, clinical finding, abnormality, neoplasm by site: too general to climb into
  min_n: 20               # SUGGESTS and TYPICALLY_AT kept when n (pool reports) >= min_n
  devices_parent: C0025080                    # Medical Devices: core devices outside the CheXpert phrases
  prj_labels: {"PRJ:no_finding": Finding, "PRJ:enlarged_cardiomediastinum": Finding,
               "PRJ:pleural_other": Finding, "PRJ:support_devices": Device}
  chexpert_hierarchy:     # child label -> parent label (design, schema decision 4)
    Edema: Lung Opacity
    Consolidation: Lung Opacity
    Lung Lesion: Lung Opacity
    Atelectasis: Lung Opacity
    Pneumonia: Consolidation
    Cardiomegaly: Enlarged Cardiomediastinum
  chexpert_children: {Lung Lesion: [C0034079, C0149726]}
  generic_is_a:           # D57(a): the CUI of these Observation strings IS_A the label (CheXpert labeler phrases)
    Lung Lesion: [nodule, mass, mass lesion, nodular opacity, nodular density, tumor, neoplasm]
    Lung Opacity: [infiltrate, increased density, reticular pattern, scar]
    Pleural Other: [fibrosis]
    Pneumonia: [infection, infectious process]
  phrase_is_a:            # D57 for CUIs reached through a pair link: the labeler phrase is verbatim in <label>.txt
    Edema: [C5194648,     # "vascular prominence" (edema.txt): pairs prominence/prominent + vascular(ity)
            C0242073]     # "vascular congestion", "pulmonary congestion" (edema.txt): congestion + (pulmonary) vascular
    Lung Opacity: [C1849561,  # "interstitial marking" (lung_opacity.txt): pairs marking + interstitial
                   C0746216]  # stem "opaci" (lung_opacity.txt): lung opacification
  llm:
    model: {model: claude-opus-5-5, effort: medium, max_tokens: 8000, timeout_seconds: 120}
    workers: 8
    suggests_prompt: prompts/kg_suggests_review_v1.txt
    suggests_top: 50
    alias_prompt: prompts/kg_alias_vi_v1.txt
    alias_top: 200        # concepts by n_pool, besides the 14 labels
    alias_max: 3
    budget_usd: 5.0
  # Vietnamese forms an alias must not hide inside (T20), on top of concepts.yaml blocked_phrases.vi.
  alias_common_phrases: [phù hợp, bình thường, không có, có thể, tương tự, so với, kích thước, vị trí, hình ảnh]

# Extra score-matrix columns beyond the 14 labels (WORKLOG D60, D62). Codes and pool strings only.
scores_ext:
  max_candidates: 30
  captions: 3              # most frequent pool strings of the concept and its IS_A descendants
  min_present: 50          # PRESENT reports on pool-val, else the concept is dropped
  quality: 0.65            # D55: lenient AUROC on pool-val, point estimate
  bootstrap: {n: 1000, seed: 20260101}
  forced:                  # weighed whatever their rank (user 2026-11-02)
    - C5563137   # low lung volumes
    - C1720922   # aspiration
    - C0011164   # degenerative change
    - C0239015   # elevated hemidiaphragm
    - C0013990   # emphysema
    - C0741171   # tortuous aorta
    - C0006663   # calcification
    - C0029453   # osteopenia
    - C0038536   # subcutaneous emphysema
    - C0028259   # nodule
    - C1167782   # hyperinflation
    - C0018188   # granuloma
    - C2004491   # scarring
  generic:                 # words with no finding of their own to caption an image by
    C2711450: enlargement of what is not said
    C0302142: deformity of what is not said
    C0221198: lesion
    C1333299: diffuse pattern
    C0700124: ectatic, dilated, distended
    C3263723: injury, trauma
    C0024115: lung disease
