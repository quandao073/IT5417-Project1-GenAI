# Query pipeline: parse -> three legs -> RRF fusion -> constraint rerank -> evidence.
# See plan sections 11 and 12. Weights are tuned on the 150 validation queries
# only, never on test.

pipeline:
  steps: [parse, retrieve, fuse, rerank, build_evidence]

# One API, three retrieval modes (plan 11.1-11.3). `label` and `vector` are the
# baselines that `hybrid` has to beat; they are not user conveniences.
modes: [label, vector, hybrid]

candidates:
  vector_top_k: 100
  report_top_k: 100
  structured_max_matches: 500

fusion:
  method: rrf
  rrf_k: 60
  weights:
    concept_match_bonus: 0.15
    uncertain_penalty: 0.05
    constraint_violation_penalty: 1.00

constraints:
  # See plan sections 10.4 and 11.4. NOT_MENTIONED is never evidence of absence.
  include_accepts: [PRESENT]
  exclude_requires: [ABSENT]
  not_mentioned_satisfies_exclude: false
  strictness_default: lenient   # strict drops NOT_MENTIONED, lenient demotes
  # exclude_present drops studies where the finding is PRESENT.
  # explicit_absence_required keeps only studies where it is ABSENT, which is
  # far rarer than NOT_MENTIONED in impression-derived labels, so it is offered
  # in the UI and reported separately rather than made the default.
  absence_policy_default: exclude_present
  uncertainty_policy_default: EXCLUDE

label_resolution:
  # labels.parquet keeps every source with provenance and never overwrites, but
  # the label filter needs exactly one status per (study, concept).
  # CHEXPERT_V1 first: it is the dataset's own label and the only radiologist-
  # assigned one, for the 234 valid/ studies. Impression outranks findings
  # because impression covers 99.93% of rows against findings' 26.6%.
  source_priority: [CHEXPERT_V1, CHEXBERT_IMPRESSION, CHEXBERT_FINDINGS, CHEXBERT_REPORT]
  on_conflict: first_non_not_mentioned

report_search:
  # Reports are English; queries may be Vietnamese. Build the FTS5 MATCH string
  # from the parsed concepts' English surface forms, never from the raw user
  # string - otherwise the report leg contributes nothing to Vietnamese queries.
  # This also makes FTS5 syntax injection impossible by construction.
  match_from: parsed_concepts
  fallback_to_semantic_query: true

explanation:
  # Evidence is assembled from real report spans, structured labels and the
  # similarity score. The LLM understands the query and nothing else: it never
  # rewrites, rephrases or adds a fact. See plan sections 5.1, 10.1 and 11.5.
  verify_spans_against_report: true

results:
  default_top_k: 10
  max_top_k: 50

degradation:
  # No single dependency may take search down. See plan section 5.1.
  on_report_index_unavailable: vector_and_label_only
  on_llm_unavailable: rule_parser
