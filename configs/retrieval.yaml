# Candidate generation, fusion and reranking. See plan section 7.
# Weights are tuned on the validation split only, never on test.

candidates:
  vector_top_k: 100
  text_top_k: 100
  kg_max_matches: 500

fusion:
  method: rrf
  rrf_k: 60
  weights:
    concept_match_bonus: 0.15
    anatomy_match_bonus: 0.10
    uncertain_penalty: 0.05
    constraint_violation_penalty: 1.00

constraints:
  # See plan sections 5.3 and 7.3. NOT_MENTIONED is never evidence of absence.
  include_accepts: [PRESENT]
  exclude_requires: [ABSENT]
  not_mentioned_satisfies_exclude: false
  # strict: drop NOT_MENTIONED results when an exclude condition is present
  # lenient: keep them but demote
  strictness_default: lenient
  anatomy_mismatch: demote   # demote | filter
  hard_filter_min_parser_confidence: 0.8

results:
  default_top_k: 10
  max_top_k: 50

modes:
  # UI toggle for comparing baseline against hybrid
  vector_only: { use_vector: true,  use_text: false, use_kg: false }
  vector_text: { use_vector: true,  use_text: true,  use_kg: false }
  hybrid:      { use_vector: true,  use_text: true,  use_kg: true  }

degradation:
  # The system must keep serving when the KG or the LLM is down. See Phase 11.
  on_neo4j_unavailable: fall_back_to_vector_text
  on_llm_unavailable: fall_back_to_rule_parser
