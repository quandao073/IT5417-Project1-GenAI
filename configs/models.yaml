# Models for embedding and query parsing. Every revision must be pinned before
# the full embedding run. See plan section 6.4.

image_encoder:
  # Phase 2 spike runs all three on 1,000 images and the gate picks the winner;
  # the decision and its numbers live in docs/model-decision.md.
  # Every revision is pinned: an HF commit sha, or the sha256 of a file that is
  # not on HF. A download that does not match stops the run.
  candidates:
    biomedclip:
      model_id: microsoft/BiomedCLIP-PubMedBERT_256-vit_base_patch16_224
      framework: open_clip
      revision: 9f341de24bfb00180f1b847274256e9b65a3a32e
      license: mit
    chexzero:
      # Not on HF: the authors publish state dicts on Google Drive
      # (github.com/rajpurkarlab/CheXzero). One checkpoint, not the paper's
      # 10-model ensemble.
      model_id: rajpurkarlab/CheXzero
      framework: openai_clip_state_dict
      filename: best_64_5e-05_original_22000_0.864.pt
      gdrive_file_id: 1P3D5qukxg3oX88LrAJwRb_03h59O9jdk
      revision: sha256:567a2efbabc6a02370de6e18178afd22ee72d7e6f29a789db1535e5c798d6ae8
      license: unspecified
    xrayclip:
      # The plan's `StanfordAIMI/XrayCLIP` does not exist; this is the ViT-B/16
      # variant. A transformers CLIPModel, not an open_clip checkpoint.
      model_id: StanfordAIMI/XrayCLIP__vit-b-16__laion2b-s34b-b88k
      framework: transformers
      revision: 0a6f84364e6d76c831daebef31b266c7928db1f0
      license: cc-by-nc-4.0
    cxrclip:
      # V1.1 image-mode encoder (WORKLOG D30): CXR-CLIP Swin-Tiny + Bio_ClinicalBERT, the
      # MIMIC-only ("M") checkpoint of github.com/kakaobrain/cxr-clip. Not on HF: the tar on
      # Kakao's CDN is converted once to a plain weights file (src/embeddings/cxrclip.py:
      # convert_checkpoint); `revision` pins that file, `source_sha256` the tar. The Swin and
      # BERT repos only supply config.json and vocab.txt; every weight comes from the checkpoint.
      # A LoRA fine-tune is another candidate with the same adapter and its own weights file.
      model_id: kakaobrain/cxr-clip
      framework: cxrclip_checkpoint
      variant: swint_m
      url: https://twg.kakaocdn.net/brainrepo/models/cxr-clip/a21ef120894e072ae77434daf6b98b72/swint_m.tar
      source_sha256: sha256:a2e5dec18b80aad726e4e416b99a09d22d7319cfc58323e17130aa4a56b0c13f
      weights: data/cache/models/cxrclip/swint_m.pt
      revision: sha256:743e23335c162cf327c73d966cd890c295757ce4da612648543b29fb9231a5d5
      swin_config: microsoft/swin-tiny-patch4-window7-224@d00d478bfaf1f417d34a1186673ad4b4be264c51
      text_config: emilyalsentzer/Bio_ClinicalBERT@d5892b39a4adaed74b92212a44081509db72f87b
      license: cc-by-nc-4.0
  # Filled with configs/concepts.yaml:<concept>.en[0]. Part of the pinned setup:
  # changing it changes every score.
  text_prompt_template: "chest x-ray showing {}"
  selected: biomedclip    # Phase 2 gate winner, see docs/model-decision.md
  revision: 9f341de24bfb00180f1b847274256e9b65a3a32e
  # Copied from artifacts/metrics/model_spike.json -> models.biomedclip.preprocessing.
  preprocessing:
    image_size: 224
    resize: "open_clip image_transform: shortest side, bicubic, center crop"
    mean: [0.48145466, 0.4578275, 0.40821073]
    std: [0.26862954, 0.26130258, 0.27577711]
    context_length: 256
    tokenizer: microsoft/BiomedCLIP-PubMedBERT_256-vit_base_patch16_224@9f341de24bfb00180f1b847274256e9b65a3a32e
    text_arch_config_unpinned: microsoft/BiomedNLP-BiomedBERT-base-uncased-abstract
  # Never hardcoded. The encoder reports its own dimension, build_manifest.json
  # records it, and `cxr validate-indexes` asserts the Qdrant collection matches.
  embedding_dim: null
  normalize: true
  batch_size: 64
  # CPU is the portable default; compose.gpu.yaml overrides the worker to cuda.
  device: cpu

text_encoder:
  # Same model as image_encoder so both embeddings share one space
  share_with_image_encoder: true
  device: cpu

llm:
  # Documentary: the running values come from Settings / .env (LLM_PROVIDER, LLM_MODEL).
  # OpenAI gpt-5-mini since 2026-10-20 (WORKLOG D22): the cheapest model within 0.02 F1
  # of the best in a dev bake-off of seven OpenAI models, then PASS on heldout with the
  # fewest errors. It rejects temperature 0, yet parsed 40/40 dev queries identically
  # twice; gpt-4.1-mini (39/40) and gpt-4o-mini take temperature 0 and repeated less,
  # so temperature 0 buys no reproducibility here. Nothing is guaranteed deterministic.
  # qwen2.5:3b-instruct-q4_K_M via Ollama remains the offline option; it failed every
  # heldout threshold (D5, P10).
  provider: openai
  model: gpt-5-mini-2025-08-07
  base_url_env: LLM_BASE_URL
  temperature: 0.0
  timeout_seconds: 20
  max_retries: 1
  # Parsed queries are cached by sha256 of the normalized user query.
  cache_parsed_queries: true
  # On LLM failure or invalid JSON, fall back to the rule parser. See plan 10.3.
  fallback: rule_based
  # Relative to configs/. The rendered prompt's sha256 is part of the parse-cache
  # key and of parser_eval.json, so a prompt edit never reuses a stale parse.
  prompt_file: prompts/query_parser_v1.txt
  num_predict: 300
  seed: 20260101
  # Ollama unloads after 5 min by default; a pause in a demo must not pay the reload.
  keep_alive: 30m
  cache_size: 1024
  # Extra fields for an OpenAI-compatible request, by exact model id; anything not
  # listed gets `default`. Model families disagree (measured 2026-10-20): gpt-5-nano
  # and gpt-5-mini reject temperature 0 and need reasoning_effort=minimal to stop
  # spending up to 1,536 reasoning tokens per parse; gpt-5.4-* take temperature 0
  # and reasoning_effort=none but reject minimal.
  hosted_request:
    default: {temperature: 0}
    gpt-5-nano-2025-08-07: {reasoning_effort: minimal}
    gpt-5-mini-2025-08-07: {reasoning_effort: minimal}
    gpt-5.4-nano-2026-03-17: {temperature: 0, reasoning_effort: none}
    gpt-5.4-mini-2026-03-17: {temperature: 0, reasoning_effort: none}

image_probe:
  # Linear probes on the frozen image encoder, trained on patients outside the corpus (spec 2026-10-23).
  lambdas: [0.1, 1, 10, 100]
  val_fraction: 0.1
  seed: 20260101
  max_iter: 50
  tol: 1.0e-6
