# Structured logging. Never log full report text or source image paths. See plan section 5.1.

level: INFO
format: json

redact:
  - patient_id
  - source_path
  - findings
  - impression

loggers:
  src.retrieval: INFO
  src.query: INFO
  uvicorn.access: WARNING

search_trace:
  # Record the score breakdown for debugging and the "Why matched?" panel
  enabled: true
  include_candidate_ranks: true
  max_candidates_logged: 20
