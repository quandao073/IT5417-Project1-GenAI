# Structured logging. Never log full report text or source image paths. See Phase 11.

level: INFO
format: json

redact:
  - patient_id
  - source_path
  - findings
  - impression

loggers:
  cxr_retrieval.retrieval: INFO
  cxr_retrieval.query: INFO
  cxr_retrieval.graph: WARNING
  uvicorn.access: WARNING

search_trace:
  # Record the score breakdown for debugging and the "Why matched?" panel
  enabled: true
  include_candidate_ranks: true
  max_candidates_logged: 20
