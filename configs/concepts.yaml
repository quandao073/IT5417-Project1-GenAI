# English and Vietnamese surface forms for the 14 CheXpert labels.
#
# Replaces the medical ontology, which is V2 work: no CUIs, no anatomy, no
# hierarchy, no relations. Three consumers:
#   - the LLM parser prompt, as the allowlist of legal `concept` values
#   - the deterministic rule parser, as a longest-match trie over EN + VI
#   - the FTS5 MATCH builder and the evidence extractor, which use `report` ONLY
#     (English, written the way the reports are), because the reports are English
#     even when the query is Vietnamese. `en`/`vi` stay frozen for the parsers.
#
# The keys are exactly the 14 CheXpert column names, so this file joins to
# configs/data.yaml:labels.pathologies and to labels.parquet:concept.
# tests/unit/test_concepts_config.py enforces that.

version: 1.0.0

concepts:
  No Finding:
    en: [no finding, normal study, unremarkable, no acute abnormality, normal chest]
    vi: [bình thường, không bất thường, không có bất thường cấp]
    report: [no acute cardiopulmonary abnormality, no acute cardiopulmonary process,
             no acute abnormality, no acute disease, no active disease, normal chest, unremarkable]

  Enlarged Cardiomediastinum:
    en: [enlarged cardiomediastinum, mediastinal widening, widened mediastinum,
         cardiomediastinal enlargement]
    vi: [trung thất giãn rộng, bóng tim trung thất to, giãn trung thất]
    report: [mediastinal widening, widened mediastinum, enlarged cardiomediastinal silhouette,
             cardiomediastinal silhouette is enlarged, mediastinal enlargement, prominent mediastinum]

  Cardiomegaly:
    en: [cardiomegaly, enlarged heart, cardiac enlargement, enlarged cardiac silhouette,
         big heart]
    vi: [tim to, bóng tim to, tim lớn, bóng tim lớn]
    report: [cardiomegaly, enlarged heart, cardiac enlargement, enlarged cardiac silhouette,
             cardiac silhouette is enlarged, heart is enlarged, heart size is enlarged, enlarged heart size]

  Lung Opacity:
    en: [lung opacity, pulmonary opacity, opacification, airspace opacity, haziness,
         airspace disease]
    vi: [mờ phổi, đám mờ phổi, tăng đậm độ phổi, mờ nhu mô]
    report: [opacity, opacities, opacification, airspace disease, haziness, hazy, infiltrate,
             infiltrates, density, densities]

  Lung Lesion:
    en: [lung lesion, pulmonary nodule, lung nodule, lung mass, pulmonary mass]
    vi: [tổn thương phổi, nốt phổi, khối phổi, u phổi]
    report: [nodule, nodules, nodular opacity, nodular opacities, mass, masses, lesion, lesions]

  Edema:
    en: [pulmonary edema, edema, vascular congestion, interstitial edema]
    vi: [phù phổi, phù, sung huyết mạch máu, phù mô kẽ]
    report: [pulmonary edema, edema, interstitial edema, vascular congestion,
             pulmonary vascular congestion, pulmonary congestion, congestion]

  Consolidation:
    en: [consolidation, airspace consolidation]
    vi: [đông đặc phổi, đông đặc]
    report: [consolidation, consolidations, consolidative, airspace consolidation]

  Pneumonia:
    en: [pneumonia, pulmonary infection, infectious process]
    vi: [viêm phổi, nhiễm trùng phổi]
    report: [pneumonia, pneumonic, infection, infectious process, infectious]

  Atelectasis:
    en: [atelectasis, atelectatic change, volume loss, lung collapse, collapsed lung]
    vi: [xẹp phổi, xẹp thùy phổi, giảm thể tích phổi]
    report: [atelectasis, atelectatic, collapse, collapsed, volume loss]

  Pneumothorax:
    en: [pneumothorax]
    vi: [tràn khí màng phổi, tràn khí]
    report: [pneumothorax, pneumothoraces, hydropneumothorax]

  Pleural Effusion:
    en: [pleural effusion, effusion, pleural fluid]
    vi: [tràn dịch màng phổi, tràn dịch, dịch màng phổi]
    report: [pleural effusion, pleural effusions, effusion, effusions, pleural fluid, hydrothorax,
             costophrenic angle blunting, blunting of the costophrenic angle]

  Pleural Other:
    en: [pleural thickening, pleural scarring, pleural plaque, pleural abnormality]
    vi: [dày màng phổi, xơ màng phổi, bất thường màng phổi]
    report: [pleural thickening, pleural scarring, pleural plaque, pleural plaques,
             pleural calcification, pleural calcifications, pleural abnormality, pleural lesion]

  Fracture:
    en: [fracture, rib fracture, clavicle fracture, displaced fracture]
    vi: [gãy xương, gãy xương sườn, gãy xương đòn]
    report: [fracture, fractures, fractured, rib fracture, rib fractures, clavicle fracture]

  Support Devices:
    en: [support device, endotracheal tube, chest tube, catheter, central line,
         picc line, pacemaker, sternotomy wire]
    vi: [dụng cụ hỗ trợ, ống nội khí quản, ống dẫn lưu màng phổi,
         máy tạo nhịp, chỉ khâu xương ức]
    report: [endotracheal tube, nasogastric tube, chest tube, tracheostomy tube, tube, tubes,
             catheter, catheters, central venous catheter, picc, port-a-cath, line, lines,
             pacemaker, pacer, sternotomy wires, sternotomy wire, wire, wires, lead, leads,
             stent, valve, clip, clips, drain, device, devices]

views:
  AP:
    en: [ap, anteroposterior, ap view]
    vi: [ap, tư thế ap]
  PA:
    en: [pa, posteroanterior, pa view]
    vi: [pa, tư thế pa]
  FRONTAL:
    en: [frontal, front view, frontal view]
    vi: [thẳng, chụp thẳng, phim thẳng, tư thế thẳng]

negation_cues:
  # A cue within a 5-token window before a concept turns it into an exclusion.
  # "no" is quoted: bare `no` is the boolean False in YAML 1.1 (PyYAML).
  en: ["no", without, absent, free of, negative for, rule out, rules out, ruled out,
       denies, not, no evidence of, resolution of]
  vi: [không, không có, chưa thấy, không thấy, loại trừ, không kèm, đã hết]

negation_cues_post:
  # A cue starting within 3 tokens AFTER a concept ("effusion is absent",
  # "pneumothorax ruled out", "tràn dịch đã hết"). Kept apart from the
  # pre-position cues: "cardiomegaly without effusion" must not negate
  # cardiomegaly, so "without" is never looked for after a concept.
  en: [absent, is absent, are absent, ruled out, is ruled out, excluded, is excluded,
       not seen, not present, not identified, resolved, has resolved]
  vi: [đã hết, không còn]

uncertainty_cues:
  en: [possible, probable, suspected, suspicious for, cannot exclude, cannot be excluded,
       can not be excluded, questionable, may represent, uncertain, equivocal, likely]
  vi: [nghi ngờ, có thể, không loại trừ, chưa rõ, khả năng, nghi]

blocked_phrases:
  # Token sequences a concept form must never match inside. Vietnamese is not
  # word-segmented: the bare form "phù" (Edema) sits inside "phù hợp" ("consistent with").
  vi: [phù hợp]
  en: []
