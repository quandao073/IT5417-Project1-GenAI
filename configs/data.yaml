# Data sources and corpus construction rules. See plan sections 2 and 6.

sources:
  images:
    name: chexpert-v1.0-small
    root: data/raw/CheXpert-v1.0-small
    format: jpg
  plus_metadata:
    name: chexpert-plus
    # File names follow the Redivis folder layout; confirmed in Phase 1.
    csv: data/raw/chexpert-plus/df_chexpert_plus_240401.csv
    radgraph_dir: data/raw/chexpert-plus/radgraph_xl
    chexbert_labels:
      findings: data/raw/chexpert-plus/labels/findings_fixed.json
      impression: data/raw/chexpert-plus/labels/impression_fixed.json
      report: data/raw/chexpert-plus/labels/report_fixed.json
  # Fallback if the join gate fails (<70%): selective download from PNG_train on Redivis.
  plus_png_fallback:
    enabled: false
    redivis_folder: PNG_train

join:
  key: path_to_image
  # Phase 1 gate (plan section 2.3). The pipeline stops below the floor.
  min_join_rate_full_corpus: 0.95
  min_join_rate_sampled: 0.70
  allow_fuzzy_match: false

corpus:
  # full_frontal | sampled_25k - decided once the audit has measured join_rate
  mode: sampled_25k
  views_allowed: [AP, PA]
  max_images_per_study: 1
  require_impression: true
  prefer_findings: true

sampling:
  seed: 20260101
  target_studies: 25000
  stratify_by_labels: true
  oversample_rare: true
  splits:
    development: 18000
    validation: 3500
    test: 3500
  split_level: patient   # chống leakage; không bao giờ đổi thành study

labels:
  # Four states, never collapsed. See plan section 5.3.
  mapping:
    "1": PRESENT
    "0": ABSENT
    "-1": UNCERTAIN
    "null": NOT_MENTIONED
  pathologies:
    - No Finding
    - Enlarged Cardiomediastinum
    - Cardiomegaly
    - Lung Opacity
    - Lung Lesion
    - Edema
    - Consolidation
    - Pneumonia
    - Atelectasis
    - Pneumothorax
    - Pleural Effusion
    - Pleural Other
    - Fracture
    - Support Devices

preprocess:
  # CheXpert-v1.0-small has a 320 px short side, ~356 px long side on average.
  # Measured: 0 of 107 sampled images exceed 512 px, so the resize step is
  # effectively a no-op. Never upscale - enlarging a downsampled image costs
  # disk and adds no information.
  max_long_side: 512
  allow_upscale: false
  thumbnail_long_side: 256
  grayscale: true
  output_format: webp
  strip_metadata: true
  batch_size: 2000

disk_guard:
  min_free_gb: 40
  project_ceiling_gb: 120
  include_wsl_vhdx: true
