# Data sources and corpus construction. See plan sections 7 and 8.
# Every number here was measured on the downloaded data, not taken from a paper.

sources:
  images:
    name: chexpert-v1.0-small
    root: data/raw/CheXpert-v1.0-small
    format: jpg
  plus_metadata:
    name: chexpert-plus
    csv: data/raw/chexpert-plus/df_chexpert_plus_240401.csv
    # Despite the .json extension these are JSONL, one object per line,
    # keyed by path_to_image.
    chexbert_labels:
      findings: data/raw/chexpert-plus/labels/findings_fixed.json
      impression: data/raw/chexpert-plus/labels/impression_fixed.json
      report: data/raw/chexpert-plus/labels/report_fixed.json
  # RadGraph-XL is present under data/raw/chexpert-plus/radgraph_xl/ but is NOT
  # ingested in V1. It belongs to the knowledge-graph work deferred to V2.

join:
  # Measured 2026-09-21 over all 223,462 rows: join rate 1.0000.
  images:
    key: path_to_image
    strategy: exact
    allow_fuzzy_match: false
    # CheXpert-small train.csv/valid.csv carry `Path` WITH the dataset-root
    # prefix; CheXpert Plus `path_to_image` does NOT. Normalize both to the
    # Plus form before joining. Deterministic operations only - no fuzzy or
    # approximate filename matching. See plan section 7.2.
    normalize: [backslash_to_slash, strip_whitespace, collapse_separators]
    strip_root_prefix: "CheXpert-v1.0-small/"
    min_full_join_rate: 0.95

corpus:
  # Measured on the Plus CSV: 191,054 frontal AP/PA rows -> 187,674 studies
  # across 64,710 patients, of which 190,913 rows carry a non-empty impression
  # (99.93%). The eligible pool is 7.5x the target, so every selected study has
  # a report and the Tier A / Tier B split of plan 7.4 is empty by construction.
  target_studies: 25000
  min_studies: 10000          # Definition of Done floor, plan section 22
  frontal_only: true
  views_allowed: [AP, PA]
  max_images_per_study: 1
  # Deterministic and unbiased. Preferring PA would give cleaner frontals but
  # skew the corpus away from the dataset's real 161,622 AP / 29,432 PA mix.
  image_selection: lowest_view_index
  require_impression: true
  # Findings exist for only 26.6% of rows, so they can never be required;
  # search_text is impression-primary with findings appended when present.
  prefer_findings: true

manifest:
  seed: 20260101
  stratify_by_labels: true
  # Every prefix of the manifest keeps the pool's label distribution, so
  # --limit picks a corpus size without re-running the sampler.
  interleave_by_stratum: true
  # The 234 valid/ studies carry radiologist-assigned labels - the only human
  # ground truth in the dataset. They are pinned to the test query set and are
  # never spent on tuning. The corpus itself is not split; see
  # configs/evaluation.yaml:query_split.
  reserve_valid_split_for_human_eval: true

labels:
  # Four states, never collapsed. NOT_MENTIONED is not ABSENT.
  mapping:
    "1": PRESENT
    "0": ABSENT
    "-1": UNCERTAIN
    "null": NOT_MENTIONED
  pathologies:
    - No Finding
    - Enlarged Cardiomediastinum
    - Cardiomegaly
    - Lung Opacity
    - Lung Lesion
    - Edema
    - Consolidation
    - Pneumonia
    - Atelectasis
    - Pneumothorax
    - Pleural Effusion
    - Pleural Other
    - Fracture
    - Support Devices

images:
  # There is no preprocessing stage. Measured on 107 random images: all are
  # mode L, none exceeds 512 px (356 px long side on average), none carries
  # EXIF, average 50.9 KB. Grayscale conversion, resizing and metadata
  # stripping would all be no-ops, and a JPEG->WebP transcode is lossy on
  # top of lossy. Serve the originals.
  serve_originals: true
  thumbnail_long_side: 256
  generate_thumbnails: false   # enable only if the result grid needs it
