# CPU-only by default: enough for the demo, because embeddings are precomputed.
# Ingestion can use the GPU:
#   docker compose -f compose.yaml -f compose.gpu.yaml --profile worker run --rm worker embed

name: cxr-semantic-retrieval

services:
  qdrant:
    image: qdrant/qdrant:v1.9.2
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      # Everything read-only. The worker writes these through its own bind
      # mount of ./data, so both sides see the same files on disk.
      - ./data/raw/CheXpert-v1.0-small:/app/data/raw/CheXpert-v1.0-small:ro
      - ./data/canonical:/app/data/canonical:ro
      - ./data/indexes:/app/data/indexes:ro
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build:
      context: ./web
      dockerfile: ../docker/web.Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: "${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}"
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  # --- profile: worker (corpus build / embedding / index build) ---
  worker:
    profiles: ["worker"]
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./configs:/app/configs
      - hf_cache:/app/.hf_cache
    depends_on:
      qdrant:
        condition: service_healthy
    entrypoint: ["cxr"]
    command: ["--help"]

  # --- profile: local-llm (only when Ollama is not running natively on host) ---
  ollama:
    profiles: ["local-llm"]
    image: ollama/ollama:0.3.12
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

volumes:
  qdrant_data:
  hf_cache:
  ollama_models:
