# pnpm 12 fails the install when a dependency with a build script is neither allowed nor
# denied. unrs-resolver (eslint import resolver) works without its script.
allowBuilds:
  unrs-resolver: false
# Flat node_modules without symlinks: `next build` (output: standalone) re-creates pnpm's
# symlinks and that needs Developer Mode on Windows (EPERM otherwise).
nodeLinker: hoisted
